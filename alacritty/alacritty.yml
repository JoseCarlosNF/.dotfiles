font:
  size: 12
  normal:
    family: monospace
    style: Regular
  bold:
    family: monospace
    style: Bold
  italic:
    family: monospace
    style: Light Italic

env:
  TERM: xterm-256color

window:
  padding:
    x: 0
    y: 0
  dynamic_padding: true
  opacity: 0.9
  decorations: none

import:
  - ~/.alacritty-colorscheme/themes/gruvbox_dark.yml

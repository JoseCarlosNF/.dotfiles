import = ["/home/jnoronha/.alacritty-colorscheme/themes/gruvbox_dark.toml"]

[env]
TERM = "xterm-256color"

[shell]
program = "/usr/bin/fish"

[font]
size = 12

[font.bold]
family = "monospace"
style = "Bold"

[font.italic]
family = "monospace"
style = "Light Italic"

[font.normal]
family = "monospace"
style = "Regular"

[window]
decorations = "none"
dynamic_padding = true
opacity = 0.8

[window.padding]
x = 1
y = 0
